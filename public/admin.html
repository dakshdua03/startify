const ADMIN_EMAIL = "admin@startify.net";
const ADMIN_PASS = localStorage.getItem("startify_admin_pass") || "Startify2026!Admin";
const ADMINS_KEY = "startify_admins";
function getAdmins(){
  try{
    const stored = JSON.parse(localStorage.getItem(ADMINS_KEY) || "null");
    if(stored && Array.isArray(stored) && stored.length) return stored;
  }catch{}
  const master = [{email: ADMIN_EMAIL.toLowerCase(), password: ADMIN_PASS, role:"master", name:"Master Admin", createdAt: new Date().toISOString()}];
  localStorage.setItem(ADMINS_KEY, JSON.stringify(master));
  return master;
}
function isMasterAdmin(email){
  const admins=getAdmins();
  const found=admins.find(a=> a.email.toLowerCase()===email.toLowerCase());
  return found && found.role==="master";
}
function getCurrentAdminEmail(){ return localStorage.getItem("startify_admin_email") || ADMIN_EMAIL; }

function load(key, fallback){ try{ const v=localStorage.getItem(key); return v? JSON.parse(v): fallback; }catch(e){return fallback;} }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function requireMaster(){
  try {
    const cur = localStorage.getItem("startify_admin_email") || "admin@startify.net";
    const admins = JSON.parse(localStorage.getItem(ADMINS_KEY) || "[]");
    const found = admins.find(a=> a.email.toLowerCase()===cur.toLowerCase());
    if(found) return found.role === "master";
  } catch {}
  return cur.toLowerCase() === "admin@startify.net";
}
function deleteUserByEmail(email, id, role){
  if(!requireMaster()){ alert("Only master admin can delete. Sub-admins have view-only access."); return; }
  const roleLabel = role || "account";
  if(email.toLowerCase()==="admin@startify.net"){
    if(!confirm(`⚠️ Delete ADMIN ${email} ? This will lock admin login!`)) return;
    if(!confirm(`Confirm again — delete admin? You can restore via 'Restore Admin' button on login.`)) return;
  } else {
    if(!confirm(`Delete ${roleLabel} ${email} ? Only this role will be removed (other roles with same email kept).`)) return;
  }
  // Demo tombstone: only if this is the last role for that email
  const isDemo = DEMO_USERS.some(d=> d.email.toLowerCase()===email.toLowerCase() && d.role===role);
  // Check if other roles with same email remain after deletion
  const allUsers = getAllData().uniqUsers;
  const otherRolesSameEmail = allUsers.some(u=> u.email.toLowerCase()===email.toLowerCase() && u.role!==role && u.id!==id);
  if(isDemo && !otherRolesSameEmail){
    const deleted = load("startify_deleted_demos", []);
    if(!deleted.includes(email.toLowerCase())){ deleted.push(email.toLowerCase()); save("startify_deleted_demos", deleted); }
  } else if(isDemo && otherRolesSameEmail){
    // Don't tombstone demo if other role still exists — just remove this role entry
  }
  let regs=load(LS_KEYS.regs, []);
  // regs role mapping: talent<->builder, backer<->funder
  const regRoleMap = {founder:"founder", talent:"builder", backer:"funder", admin:"admin"};
  const targetRegRole = regRoleMap[role] || role;
  regs=regs.filter(r=> !(r.email.toLowerCase()===email.toLowerCase() && (r.role===targetRegRole || r.role===role)));
  // If no role provided, fallback to email only (legacy)
  if(!role) regs=regs.filter(r=> r.email.toLowerCase()!==email.toLowerCase());
  save(LS_KEYS.regs, regs);
  let builders=load(LS_KEYS.builders, []);
  builders=builders.filter(b=> !(b.id===id || ((b.email||"").toLowerCase()===email.toLowerCase() && role==="talent")));
  save(LS_KEYS.builders, builders);
  let funders=load(LS_KEYS.funders, []);
  funders=funders.filter(f=> !(f.id===id || ((f.email||"").toLowerCase()===email.toLowerCase() && role==="backer")));
  save(LS_KEYS.funders, funders);
  let pending=load(LS_KEYS.pendingBackers, []);
  pending=pending.filter(p=> !(p.id===id || (p.email.toLowerCase()===email.toLowerCase() && role==="backer")));
  save(LS_KEYS.pendingBackers, pending);
  try{
    const profs=JSON.parse(localStorage.getItem("startify_user_profiles")||"[]");
    // Only remove this role, keep other roles with same email
    const filtered = profs.filter(p=> !(p.email.toLowerCase()===email.toLowerCase() && p.role===role && p.id===id) && !(p.email.toLowerCase()===email.toLowerCase() && p.role===role && !id));
    // If role not provided, fallback
    const finalFiltered = role ? profs.filter(p=> !(p.email.toLowerCase()===email.toLowerCase() && p.role===role)) : profs.filter(p=> p.email.toLowerCase()!==email.toLowerCase() && p.id!==id);
    // Use role-aware filter
    const toSave = profs.filter(p=> !(p.email.toLowerCase()===email.toLowerCase() && p.role===role));
    localStorage.setItem("startify_user_profiles", JSON.stringify(role ? toSave : filtered));
  }catch{}
  try{
    const creds=load(LS_KEYS.credentials, {});
    // Only delete credential if no other role with same email remains
    const remainingProfiles = (()=>{ try{ return JSON.parse(localStorage.getItem("startify_user_profiles")||"[]"); }catch{return [];} })();
    const stillHasEmail = remainingProfiles.some(p=> p.email.toLowerCase()===email.toLowerCase()) || load(LS_KEYS.regs, []).some(r=> r.email.toLowerCase()===email.toLowerCase());
    if(!stillHasEmail){
      delete creds[email.toLowerCase()];
      save(LS_KEYS.credentials, creds);
    }
  }catch{}
  try{
    const profiles=load(LS_KEYS.profiles, []);
    save(LS_KEYS.profiles, profiles.filter(p=> !(p.email.toLowerCase()===email.toLowerCase() && p.role===role)));
  }catch{}
  alert("Deleted: "+email+" ("+roleLabel+")" + (isDemo && !otherRolesSameEmail ? " (demo hidden)" : ""));
  render();
}
function restoreAdminAccount(){
  const deleted = load("startify_deleted_demos", []);
  const filtered = deleted.filter(e=> e !== "admin@startify.net");
  save("startify_deleted_demos", filtered);
  // Ensure admin credential exists
  const creds = load(LS_KEYS.credentials, {});
  creds["admin@startify.net"] = "Startify2026!Admin";
  save(LS_KEYS.credentials, creds);
  // Ensure admin profile exists
  const profs = load(LS_KEYS.profiles, []);
  if(!profs.some(p=> p.email.toLowerCase()==="admin@startify.net")){
    profs.push({id:"user_admin", name:"Startify Admin", email:"admin@startify.net", role:"admin", createdAt: new Date().toISOString()});
    save(LS_KEYS.profiles, profs);
  }
  alert("Admin restored: admin@startify.net / Startify2026!Admin");
  render();
}
function deleteBuilderById(id){
  if(!requireMaster()){ alert("Only master admin can delete."); return; }
  if(!confirm(`Delete builder ${id} ?`)) return;
  const isSeed = SEED_BUILDERS.some(s=> s.id===id);
  if(isSeed){
    const deleted=load("startify_deleted_builders", []);
    if(!deleted.includes(id)){ deleted.push(id); save("startify_deleted_builders", deleted); }
  }
  let builders=load(LS_KEYS.builders, []);
  const target=builders.find(b=> b.id===id) || SEED_BUILDERS.find(s=> s.id===id);
  builders=builders.filter(b=> b.id!==id);
  save(LS_KEYS.builders, builders);
  if(target && target.email){
    let regs=load(LS_KEYS.regs, []);
    regs=regs.filter(r=> r.email.toLowerCase()!==target.email.toLowerCase());
    save(LS_KEYS.regs, regs);
    try{
      const profs=JSON.parse(localStorage.getItem("startify_user_profiles")||"[]");
      localStorage.setItem("startify_user_profiles", JSON.stringify(profs.filter(p=> p.id!==id && (p.email||"").toLowerCase()!==target.email.toLowerCase())));
    }catch{}
    try{
      const creds=load(LS_KEYS.credentials, {});
      delete creds[target.email.toLowerCase()];
      save(LS_KEYS.credentials, creds);
    }catch{}
  }
  alert("Deleted builder: "+(target?target.name:id));
  render();
}

function editBuilderById(id){
  let builders=load(LS_KEYS.builders, []);
  const target=builders.find(b=> b.id===id) || SEED_BUILDERS.find(s=> s.id===id);
  if(!target){ alert("Builder not found"); return; }
  const newName=prompt("Edit name:", target.name||"");
  if(newName===null) return;
  const newSkills=prompt("Edit skills:", target.skills||"");
  if(newSkills===null) return;

  const next=builders.filter(b=> b.id!==id);
  save(LS_KEYS.builders, [updated, ...next]);
  alert("Updated builder: "+updated.name);
  render();
}

function deleteIdeaById(id){
  if(!requireMaster()){ alert("Only master admin can delete."); return; }
  if(!confirm(`Delete idea ${id} ?`)) return;
  let stored=load(LS_KEYS.ideas, []);
  // also need to handle seed: if it's seed, we add tombstone by saving without it? Instead we store deleted marker
  // For seed ideas, we save a filtered list with that id marked as deleted via localStorage hide flag is complex; instead we save stored with that id removed and also save a hidden set
  const all=getAllData().ideas;
  const target=all.find(i=>i.id===id);
  const next=stored.filter(i=>i.id!==id);
  // If it's a seed with no stored entry, we need to create a deletion marker: save a dummy with status Rejected to hide? Simpler: add to stored a tombstone with status Deleted
  const isSeed = SEED_IDEAS.some(s=> s.id===id) && !stored.some(s=> s.id===id);
  if(isSeed){
    save(LS_KEYS.ideas, [{id, status:"Deleted_By_Admin", deleted:true}, ...next]);
  } else {
    save(LS_KEYS.ideas, next);
  }
  // also remove from Firestore? No — local only
  alert("Deleted idea: "+(target?target.title:id));
  render();
}
function editIdeaById(id){
  const all=getAllData().ideas;
  const target=all.find(i=>i.id===id);
  if(!target){ alert("Idea not found"); return; }
  const newTitle=prompt("Edit title:", target.title||"");
  if(newTitle===null) return;
  const newDesc=prompt("Edit description:", target.desc||"");
  if(newDesc===null) return;
  const updated={...target, title:newTitle.trim()||target.title, desc:newDesc.trim()||target.desc};
  let stored=load(LS_KEYS.ideas, []);
  const next=stored.filter(i=>i.id!==id);
  save(LS_KEYS.ideas, [updated, ...next]);
  alert("Updated idea: "+updated.title);
  render();
}

function getAllData(){
  // Deduplicate ideas by id — stored overrides seed (prevents replication on approve), deleted tombstones hide seed
  const storedIdeas = load(LS_KEYS.ideas, []);
  const deletedIds = new Set(storedIdeas.filter(i=> i.deleted).map(i=>i.id));
  const ideaMap = new Map();
  SEED_IDEAS.forEach(i=> { if(!deletedIds.has(i.id)) ideaMap.set(i.id, i); });
  storedIdeas.forEach(i=> { if(i.deleted) ideaMap.delete(i.id); else ideaMap.set(i.id, i); });
  const ideas = Array.from(ideaMap.values());
  const regs = load(LS_KEYS.regs, null) || [
    {name:"Rahul Sharma", email:"rahul@uohyd.ac.in", role:"founder", registeredAt:"2026-08-23"},
    {name:"Aditi Rao", email:"aditi@uohyd.ac.in", role:"builder", registeredAt:"2026-08-22"},
    {name:"Karan Patel", email:"karan@angelnet.in", role:"funder", registeredAt:"2026-08-21"},
  ];
  const builders = [...load(LS_KEYS.builders, []), ...SEED_BUILDERS];
  const funders = [...load(LS_KEYS.funders, []), ...SEED_FUNDERS];
  const storedEvents = load(LS_KEYS.events, []);
  const deletedEventIds = new Set(storedEvents.filter(e=> e.deleted).map(e=>e.id));
  const events = [...storedEvents.filter(e=>!e.deleted), ...SEED_EVENTS.filter(e=> !deletedEventIds.has(e.id))];
  const requests = [...load(LS_KEYS.requests, []), ...SEED_REQUESTS];
  const messages = [...load(LS_KEYS.messages, []), ...SEED_MESSAGES];
  const pendingBackers = load(LS_KEYS.pendingBackers, []);
  const credentials = load(LS_KEYS.credentials, {});
  const profiles = load(LS_KEYS.profiles, []);
  const deletedDemos = load("startify_deleted_demos", []);
  const filteredDemos = DEMO_USERS.filter(d=> !deletedDemos.includes(d.email.toLowerCase()));
  const deletedBuilders = load("startify_deleted_builders", []);
  const filteredSeedBuilders = SEED_BUILDERS.filter(b=> !deletedBuilders.includes(b.id));
  const deletedFunders = load("startify_deleted_funders", []);
  const filteredSeedFunders = SEED_FUNDERS.filter(f=> !deletedFunders.includes(f.id));
  // Include profiles (normal site registrations via password+link) so admin sees all accounts
  const credUsers = Object.keys(credentials).map(email=> {
    const p = profiles.find(x=> x.email.toLowerCase()===email.toLowerCase());
    const r = regs.find(x=> x.email.toLowerCase()===email.toLowerCase());
    return {id: p?.id || r?.id || email, name: p?.name || r?.name || email.split("@")[0], email, role: p?.role || r?.role || "founder", createdAt: p?.createdAt || r?.registeredAt || "—", source:"credential"};
  });
  const allUsers = [...filteredDemos.map(u=>({...u, source:"demo"})), ...regs.map(r=>({id:r.email, name:r.name, email:r.email, role: r.role==="builder"?"talent":r.role==="funder"?"backer":r.role, createdAt:r.registeredAt, source:"registration"})), ...profiles.map(p=>({id:p.id, name:p.name, email:p.email, role:p.role, createdAt:p.createdAt, source:"profile"})), ...credUsers.map(c=>({...c, source:"credential"})), ...[...builders, ...filteredSeedBuilders].map(b=>({id:b.id, name:b.name, email:b.email||b.id+"@uohyd.ac.in", role:"talent", source:"builder"})), ...[...funders, ...filteredSeedFunders].map(f=>({id:f.id, name:f.name, email:f.email||f.id+"@startify.net", role:"backer", source:"funder"})), ...pendingBackers.map(p=>({id:p.id, name:p.name, email:p.email, role:"backer", createdAt:p.createdAt, pending:true, source:"pending"}))];
  // de-dupe by email+role so same email with different roles shows separately, then group same email together
  const seen=new Set(); const uniqUsers=[];
  for(const u of allUsers){ const key=u.email.toLowerCase()+"|"+u.role; if(!seen.has(key)){ seen.add(key); uniqUsers.push(u); } }
  uniqUsers.sort((a,b)=> a.email.toLowerCase().localeCompare(b.email.toLowerCase()) || a.role.localeCompare(b.role));
  // For overview counts, also compute deduped by email only for total
  return {ideas, regs, builders, funders, requests, messages, events, pendingBackers, credentials, profiles, uniqUsers};
}

let currentTab = "overview";

function isLogged(){ return localStorage.getItem(LS_KEYS.adminSession)==="true"; }

function render(){
  const root=document.getElementById("app");
  if(!isLogged()){
    root.innerHTML = `
      <div class="min-h-screen grid place-items-center p-6 bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-800">
        <div class="w-full max-w-[420px] rounded-[28px] bg-white p-8 shadow-2xl">
          <div class="text-center">
            <div class="inline-flex items-center gap-2 rounded-full bg-indigo-50 border border-indigo-200 px-3 py-1 text-[11px] font-bold uppercase tracking-widest text-indigo-700">University of Hyderabad • Admin</div>
            <h1 class="font-heading text-[28px] font-extrabold mt-3 text-slate-900">Startify Admin</h1>
            <p class="text-sm text-slate-500 mt-1">Sole admin access • You have all data</p>
          </div>
          <form id="loginForm" class="mt-6 space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Admin Email</label>
              <input id="loginEmail" required type="email" value="" class="w-full h-11 rounded-full bg-slate-50 border border-slate-200 px-4 text-sm outline-none focus:border-slate-300 text-slate-900" placeholder="admin@startify.net">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
              <input id="loginPass" required type="password" value="" class="w-full h-11 rounded-full bg-slate-50 border border-slate-200 px-4 text-sm outline-none focus:border-slate-300 text-slate-900" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full h-11 rounded-full bg-slate-900 text-white font-bold text-sm hover:bg-slate-800 transition">Enter Admin →</button>
            <a href="/" class="block text-center text-xs text-slate-500 hover:text-slate-700 underline">← Back to Startify</a>
          </form>
          <div class="mt-6 rounded-2xl bg-amber-50 border border-amber-200 p-3 text-[11px] leading-4 text-amber-800">Master admin: <strong>admin@startify.net</strong> — create sub-admins inside after login.</div>
        </div>
      </div>`;
    document.getElementById("loginForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const email=document.getElementById("loginEmail").value.trim().toLowerCase();
      const pass=document.getElementById("loginPass").value;
      const admins=getAdmins();
      const found=admins.find(a=> a.email.toLowerCase()===email && a.password===pass);
      // Fallback to hardcoded master if admins list empty
      const isMasterHardcoded = email===ADMIN_EMAIL.toLowerCase() && pass===ADMIN_PASS;
      if(found || isMasterHardcoded){
        localStorage.setItem(LS_KEYS.adminSession,"true");
        localStorage.setItem("startify_admin_email", email);
        // Ensure master exists in list
        if(isMasterHardcoded && !admins.some(a=> a.email.toLowerCase()===email)){
          admins.push({email, password:pass, role:"master", name:"Master Admin", createdAt: new Date().toISOString()});
          localStorage.setItem(ADMINS_KEY, JSON.stringify(admins));
        }
        render();
      } else {
        alert("Invalid admin credentials.");
      }
    });
    return;
  }

  let data=getAllData();
  // Auto-sync: ensure every user has a password entry so Users == Passwords (fixes more users than passwords)

              </div>
            `).join("")}
          </div>
          <p class="mt-3 text-[11px] text-slate-500">Sub-admins log in with their email + password on this same page. They see all tabs except Chats and Admins, and all Delete buttons are hidden for them.</p>
        </div>
      </div>
    `;
    document.getElementById("adminForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const name=document.getElementById("aName").value.trim();
      const email=document.getElementById("aEmail").value.trim().toLowerCase();
      const pass=document.getElementById("aPass").value;
      if(!name || !email || !pass){ alert("All fields required"); return; }
      if(pass.length<6){ alert("Password min 6 chars"); return; }
      const admins=getAdmins();
      if(admins.some(a=> a.email.toLowerCase()===email)){ alert("Admin with this email already exists"); return; }
      admins.push({email, password:pass, role:"admin", name, createdAt: new Date().toISOString()});
      localStorage.setItem(ADMINS_KEY, JSON.stringify(admins));
      // also ensure credential exists so Passwords tab stays consistent
      const creds=load(LS_KEYS.credentials, {});
      if(!creds[email]){ creds[email]=pass; save(LS_KEYS.credentials, creds); }
      alert("Admin added: "+email);
      render();
    });
    content.querySelectorAll(".delAdminBtn").forEach(b=> b.addEventListener("click", ()=>{
      const email=b.dataset.delAdmin;
      if(!confirm("Remove admin "+email+"?")) return;
      let admins=getAdmins();
      admins=admins.filter(a=> a.email.toLowerCase()!==email.toLowerCase());
      localStorage.setItem(ADMINS_KEY, JSON.stringify(admins));
      render();
    }));
  }
}

render();
</script>
</body>
</html>
