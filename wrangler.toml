name = "startify-daksh-accelerator"
compatibility_date = "2024-01-01"

# For Cloudflare Pages, static assets are auto-deployed from ./dist
# Do NOT use [site] - deprecated for Workers Sites
# Deploy via: `npm run build` then `npx wrangler pages publish dist` OR connect Git to Pages

# Pages Functions in ./functions are auto-deployed
# Build handled by Pages: npm run build -> dist

# Environment variables - set in Cloudflare dashboard > Pages > Settings > Variables
# VITE_SUPABASE_URL
# VITE_SUPABASE_ANON_KEY